# Domains the hourly run draws from. Edit freely: add domains, remove ones you
# don't want, or add seed topics to steer what gets written next. The run picks
# the least-covered domain for breadth runs and works the frontier for depth runs.
# Seeds are suggestions, not a queue: skip any that already exist, and check each
# service's lifecycle (AWS renames and retires services) before writing.
# Mix of Cloud Practitioner foundations and Solutions Architect depth.

